<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EGJ – Annotatore</title>
<style>
  :root{--bg:#0f1115;--pn:#1a1d24;--bd:#2c313b;--tx:#e7e9ee;--mu:#9aa0ab;--scope:#ff4fd8;--egj:#39d98a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;height:100dvh}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:var(--pn);border-bottom:1px solid var(--bd)}
  .bar.bottom{border-top:1px solid var(--bd);border-bottom:none}
  button,select,input[type=text]{background:#232733;color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px 11px;font-size:14px}
  input[type=text]{-webkit-user-select:text;user-select:text}
  button.on{outline:2px solid currentColor}
  button.scope{color:var(--scope)} button.egj{color:var(--egj)}
  button.pri{background:#2b6cb0;border-color:#2b6cb0;color:#fff}
  #stage{flex:1;position:relative;background:#000;touch-action:none;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .grow{flex:1}
  .mu{color:var(--mu);font-size:13px}
  label.ck{font-size:13px;color:var(--mu);display:flex;gap:4px;align-items:center}
  #help{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--mu);text-align:center;font-size:15px;line-height:1.6;pointer-events:none}
  #toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000c;padding:6px 12px;border-radius:8px;font-size:13px;display:none}
</style>
</head>
<body>

<div class="bar">
  <input type="text" id="op" placeholder="Nome operatore" style="width:150px">
  <button class="pri" id="bLoad">Carica foto</button>
  <input type="file" id="fImg" accept="image/*" multiple style="display:none">
  <button id="bPrev">◀</button>
  <select id="sel" class="grow" style="min-width:140px"></select>
  <button id="bNext">▶</button>
  <span class="mu" id="count">0/0</span>
</div>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="help">1. Scrivi il tuo nome · 2. Carica le foto<br>
    3. Scegli <b style="color:var(--scope)">Endoscopio</b> e traccia il contorno chiuso in un solo tratto<br>
    4. Scegli <b style="color:var(--egj)">EGJ</b> e traccia il contorno dell'apertura<br>
    Con la penna disegni · con le dita sposti e zoomi (pizzica)<br>
    Mouse: rotella = zoom · Shift+trascina = sposta</div>
  <div id="toast"></div>
</div>

<div class="bar bottom">
  <button class="scope on" id="lScope">Endoscopio</button>
  <button class="egj" id="lEgj">EGJ</button>
  <button id="bUndo">↩︎ Annulla</button>
  <button id="bClear">Cancella livello</button>
  <button id="bFit">Adatta</button>
  <label class="ck"><input type="checkbox" id="qObl">obliqua</label>
  <label class="ck"><input type="checkbox" id="qBlur">sfocata</label>
  <label class="ck"><input type="checkbox" id="qNo">non annotabile</label>
  <input type="text" id="note" placeholder="nota" class="grow" style="min-width:100px">
  <button id="bExp" class="pri">Esporta</button>
  <button id="bImp">Importa</button>
  <input type="file" id="fJson" accept=".json,application/json" style="display:none">
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d'), stage=$('stage');
let imgs=[], cur=-1, layer='scope';
let ann={};                         // nomeFile -> {w,h,scope,egj,flags,note,t,op}
let hist={};                        // nomeFile -> [{layer,prev}]
let view={s:1,ox:0,oy:0};
const KEY='egj_annotatore_v1';

// ---------- persistenza locale, separata per operatore (best effort) ----------
let store={}, curOp='';
function save(){ store[curOp]=ann; try{ localStorage.setItem(KEY,JSON.stringify({last:curOp,store})); }catch(e){ toast('Memoria piena: esporta subito!'); } }
try{ const d=JSON.parse(localStorage.getItem(KEY)||'null'); if(d&&d.store){ store=d.store; curOp=d.last||''; ann=store[curOp]||{}; $('op').value=curOp; } }catch(e){}
$('op').onchange=()=>{ store[curOp]=ann; curOp=$('op').value.trim(); ann=store[curOp]||{}; hist={}; save(); refreshList(); if(cur>=0) go(cur); toast('Operatore: '+(curOp||'—')); };

// ---------- caricamento immagini ----------
$('bLoad').onclick=()=>$('fImg').click();
$('fImg').onchange=e=>{
  const files=[...e.target.files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  let left=files.length; if(!left) return;
  files.forEach(f=>{
    if(imgs.find(x=>x.name===f.name)){ if(--left===0) afterLoad(); return; }
    const im=new Image();
    im.onload=()=>{ imgs.push({name:f.name,img:im,w:im.naturalWidth,h:im.naturalHeight}); if(--left===0) afterLoad(); };
    im.onerror=()=>{ toast('Formato non leggibile: '+f.name); if(--left===0) afterLoad(); };
    im.src=URL.createObjectURL(f);
  });
  e.target.value='';
};
function afterLoad(){
  imgs.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  refreshList(); if(cur<0 && imgs.length) go(0); else refreshList();
  $('help').style.display=imgs.length?'none':'flex';
}
function status(n){ const a=ann[n]; if(!a) return '○○';
  if(a.flags&&a.flags.no) return '✕ ';
  return (a.scope?'●':'○')+(a.egj?'●':'○'); }
function refreshList(){
  const s=$('sel'); s.innerHTML='';
  imgs.forEach((x,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=status(x.name)+'  '+x.name; s.appendChild(o); });
  if(cur>=0) s.value=cur;
  const done=imgs.filter(x=>{const a=ann[x.name]; return a&&((a.scope&&a.egj)||(a.flags&&a.flags.no));}).length;
  $('count').textContent=`${done}/${imgs.length} completate`;
}
$('sel').onchange=e=>go(+e.target.value);
$('bPrev').onclick=()=>{ if(cur>0) go(cur-1); };
$('bNext').onclick=()=>{ if(cur<imgs.length-1) go(cur+1); };
function curName(){ return cur>=0?imgs[cur].name:null; }
function A(){ const x=imgs[cur]; if(!ann[x.name]) ann[x.name]={w:x.w,h:x.h,scope:null,egj:null,flags:{},note:''}; return ann[x.name]; }
function go(i){
  cur=i; const a=ann[imgs[i].name]||{flags:{},note:''};
  $('qObl').checked=!!(a.flags&&a.flags.obl); $('qBlur').checked=!!(a.flags&&a.flags.blur);
  $('qNo').checked=!!(a.flags&&a.flags.no); $('note').value=a.note||'';
  setLayer(a.scope && !a.egj ? 'egj' : 'scope');
  fit(); refreshList();
}
['qObl','qBlur','qNo'].forEach(id=>$(id).onchange=()=>{ if(cur<0)return; const a=A();
  a.flags={obl:$('qObl').checked,blur:$('qBlur').checked,no:$('qNo').checked}; touch(a); });
$('note').oninput=()=>{ if(cur<0)return; const a=A(); a.note=$('note').value; touch(a); };
function touch(a){ a.t=new Date().toISOString(); a.op=$('op').value; save(); refreshList(); }

// ---------- livelli ----------
function setLayer(l){ layer=l; $('lScope').classList.toggle('on',l==='scope'); $('lEgj').classList.toggle('on',l==='egj'); }
$('lScope').onclick=()=>setLayer('scope'); $('lEgj').onclick=()=>setLayer('egj');
$('bUndo').onclick=()=>{ const n=curName(); if(!n)return; const h=hist[n]; if(!h||!h.length)return;
  const u=h.pop(); A()[u.layer]=u.prev; touch(A()); draw(); };
$('bClear').onclick=()=>{ if(cur<0)return; const a=A(); if(!a[layer])return; push(layer,a[layer]); a[layer]=null; touch(a); draw(); };
function push(l,prev){ const n=curName(); (hist[n]=hist[n]||[]).push({layer:l,prev}); }

// ---------- vista ----------
function resize(){ const r=stage.getBoundingClientRect(), d=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d); ctx.setTransform(d,0,0,d,0,0); draw(); }
window.addEventListener('resize',()=>{ resize(); });
function fit(){ if(cur<0)return; const r=stage.getBoundingClientRect(), x=imgs[cur];
  const s=Math.min(r.width/x.w, r.height/x.h)*0.97; view={s,ox:(r.width-x.w*s)/2,oy:(r.height-x.h*s)/2}; draw(); }
$('bFit').onclick=fit;
const toImg=(sx,sy)=>[(sx-view.ox)/view.s,(sy-view.oy)/view.s];

// ---------- disegno ----------
let stroke=null;
function draw(){
  const r=stage.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height);
  if(cur<0)return; const x=imgs[cur], a=ann[x.name]||{};
  ctx.save(); ctx.translate(view.ox,view.oy); ctx.scale(view.s,view.s);
  ctx.imageSmoothingEnabled=view.s<3; ctx.drawImage(x.img,0,0);
  const lw=2/view.s;
  poly(a.scope,'#ff4fd8','rgba(255,79,216,.18)',lw,layer==='scope');
  poly(a.egj,'#39d98a','rgba(57,217,138,.20)',lw,layer==='egj');
  if(stroke&&stroke.length>1){ ctx.strokeStyle=layer==='scope'?'#ff4fd8':'#39d98a'; ctx.lineWidth=lw*1.3;
    ctx.beginPath(); stroke.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); }
  ctx.restore();
}
function poly(p,st,fi,lw,act){ if(!p||p.length<3)return; ctx.beginPath(); p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
  ctx.fillStyle=fi; ctx.fill(); ctx.strokeStyle=st; ctx.lineWidth=act?lw*1.4:lw; ctx.stroke(); }

// ---------- input: penna/mouse disegnano, dita spostano/zoomano ----------
let penSeen=false, drawId=null, touches=new Map(), gest=null;
function local(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
cv.addEventListener('pointerdown',e=>{
  if(cur<0)return; cv.setPointerCapture(e.pointerId);
  if(e.pointerType==='pen') penSeen=true;
  const isDraw = e.pointerType==='pen' || (e.pointerType==='mouse'&&e.button===0&&!e.shiftKey) || (e.pointerType==='touch'&&!penSeen&&touches.size===0);
  if(e.pointerType==='touch'){ touches.set(e.pointerId,local(e)); if(touches.size>=2||penSeen){ cancelStroke(); startGesture(); return; } }
  if(e.pointerType==='mouse'&&(e.shiftKey||e.button===1||e.button===2)){ gest={mouse:true,p0:local(e),v0:{...view}}; return; }
  if(isDraw && drawId===null){ drawId=e.pointerId; const [sx,sy]=local(e); stroke=[toImg(sx,sy)]; draw(); }
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'&&touches.has(e.pointerId)){ touches.set(e.pointerId,local(e)); if(gest&&!gest.mouse){ doGesture(); return; } }
  if(gest&&gest.mouse){ const p=local(e); view.ox=gest.v0.ox+p[0]-gest.p0[0]; view.oy=gest.v0.oy+p[1]-gest.p0[1]; draw(); return; }
  if(e.pointerId===drawId&&stroke){
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evs){ const [sx,sy]=local(ev), q=toImg(sx,sy), l=stroke[stroke.length-1];
      if(Math.hypot(q[0]-l[0],q[1]-l[1])*view.s>1.5) stroke.push(q); }
    draw();
  }
});
function endPtr(e){
  if(e.pointerType==='touch'){ touches.delete(e.pointerId); if(touches.size<2&&gest&&!gest.mouse){ gest=touches.size===1?(startGesture(),gest):null; } }
  if(gest&&gest.mouse){ gest=null; return; }
  if(e.pointerId===drawId){ drawId=null; finishStroke(); }
}
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',e=>{ if(e.pointerId===drawId){drawId=null;cancelStroke();} endPtr(e); });
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
function cancelStroke(){ stroke=null; drawId=null; draw(); }
function finishStroke(){
  const s=stroke; stroke=null;
  if(!s||s.length<8){ draw(); toast('Tratto troppo corto'); return; }
  let ar=0; for(let i=0;i<s.length;i++){const a=s[i],b=s[(i+1)%s.length]; ar+=a[0]*b[1]-b[0]*a[1];}
  if(Math.abs(ar)/2<30){ draw(); toast('Contorno troppo piccolo'); return; }
  const a=A(); push(layer,a[layer]);
  a[layer]=rdp(s,0.25).map(p=>[+p[0].toFixed(1),+p[1].toFixed(1)]); touch(a);
  if(layer==='scope'&&!a.egj) setLayer('egj');
  draw();
}
// semplificazione Douglas-Peucker (tolleranza in pixel immagine)
function rdp(pts,eps){ if(pts.length<3) return pts;
  const keep=new Uint8Array(pts.length); keep[0]=keep[pts.length-1]=1; const st=[[0,pts.length-1]];
  while(st.length){ const [i,j]=st.pop(); const [ax,ay]=pts[i],[bx,by]=pts[j]; const L=Math.hypot(bx-ax,by-ay)||1e-9; let md=-1,mk=-1;
    for(let k=i+1;k<j;k++){ const d=Math.abs((bx-ax)*(ay-pts[k][1])-(ax-pts[k][0])*(by-ay))/L; if(d>md){md=d;mk=k;} }
    if(md>eps){ keep[mk]=1; st.push([i,mk],[mk,j]); } }
  return pts.filter((_,k)=>keep[k]); }
function startGesture(){ const p=[...touches.values()];
  if(p.length>=2){ gest={d0:Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]),m0:[(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2],v0:{...view}}; }
  else if(p.length===1){ gest={single:true,p0:p[0],v0:{...view}}; } }
function doGesture(){ const p=[...touches.values()];
  if(p.length>=2&&gest.d0){ const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]), m=[(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2];
    const s=Math.max(0.05,Math.min(40,gest.v0.s*d/gest.d0)); const nx=(gest.m0[0]-gest.v0.ox)/gest.v0.s, ny=(gest.m0[1]-gest.v0.oy)/gest.v0.s;
    view={s,ox:m[0]-nx*s,oy:m[1]-ny*s}; }
  else if(p.length===1&&gest.single){ view.ox=gest.v0.ox+p[0][0]-gest.p0[0]; view.oy=gest.v0.oy+p[0][1]-gest.p0[1]; }
  draw(); }
cv.addEventListener('wheel',e=>{ e.preventDefault(); if(cur<0)return; const [mx,my]=local(e), f=Math.exp(-e.deltaY*0.0015);
  const nx=(mx-view.ox)/view.s, ny=(my-view.oy)/view.s; view.s=Math.max(0.05,Math.min(40,view.s*f)); view.ox=mx-nx*view.s; view.oy=my-ny*view.s; draw(); },{passive:false});

// ---------- esporta / importa ----------
$('bExp').onclick=()=>{
  const op=$('op').value.trim(); if(!op){ toast('Scrivi prima il nome operatore'); $('op').focus(); return; }
  const out={tool:'EGJ annotatore v1',operatore:op,esportato:new Date().toISOString(),
    nota_coordinate:'pixel dell\'immagine originale, origine in alto a sinistra',
    immagini:Object.entries(ann).filter(([n,a])=>a.scope||a.egj||(a.flags&&a.flags.no)).map(([n,a])=>({
      file:n,larghezza:a.w,altezza:a.h,endoscopio:a.scope,egj:a.egj,
      obliqua:!!(a.flags&&a.flags.obl),sfocata:!!(a.flags&&a.flags.blur),non_annotabile:!!(a.flags&&a.flags.no),
      nota:a.note||'',annotato_il:a.t||null}))};
  const b=new Blob([JSON.stringify(out,null,1)],{type:'application/json'}), u=URL.createObjectURL(b), l=document.createElement('a');
  l.href=u; l.download=`annotazioni_EGJ_${op.replace(/\W+/g,'_')}_${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(l); l.click(); l.remove();
  toast(`Esportate ${out.immagini.length} immagini`);
};
$('bImp').onclick=()=>$('fJson').click();
$('fJson').onchange=e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); (d.immagini||[]).forEach(x=>{ ann[x.file]={w:x.larghezza,h:x.altezza,scope:x.endoscopio,egj:x.egj,
      flags:{obl:x.obliqua,blur:x.sfocata,no:x.non_annotabile},note:x.nota||'',t:x.annotato_il,op:d.operatore}; });
      if(d.operatore&&!curOp){ delete store['']; curOp=d.operatore; $('op').value=curOp; } save(); refreshList(); if(cur>=0) go(cur); toast('Importate '+(d.immagini||[]).length+' annotazioni'); }
    catch(err){ toast('File non valido'); } };
  rd.readAsText(f); e.target.value=''; };

function toast(t){ const el=$('toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast.h); toast.h=setTimeout(()=>el.style.display='none',2200); }
window.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight')$('bNext').click(); if(e.key==='ArrowLeft')$('bPrev').click();
  if(e.key==='1')setLayer('scope'); if(e.key==='2')setLayer('egj'); if((e.metaKey||e.ctrlKey)&&e.key==='z')$('bUndo').click(); });
resize(); refreshList();
</script>
</body>
</html>
